interface:
  display_name: "公考机构 GEO 调研 v2.2.1"
  short_description: "先确认地区市场主体，再测真实 AI 提名；默认输出全中文 Word 咨询报告"
  default_prompt: "使用 $acs-gongkao-geo-research v2.2.1。先只确认尚未提供的三项：地区、用户希望一定覆盖的机构/品牌/老师个人品牌名单、是否允许系统补充竞争主体。正式输出固定为简体中文 Word/DOCX，不再询问格式。用户指定主体只保证研究不加分。系统补充发现后，每个准备进入正式研究的主体至少保留 1 条可核验来源 URL，再展示全国品牌、本地/区域机构、老师/个人品牌、观察主体四类研究主体池并获得确认。核心 GEO 使用固定无品牌问题记录真实 AI 回答中的提名率、前三出现率、第一位出现率和结果稳定性；机构推荐类问题与老师推荐类问题分开测量，不混用样本分母。公开 Web 资产只作为 GEO 资产基础和概念占位的解释层。客户报告只展示结论、排名、重点优化机会、结果稳定性、重点主体诊断和行动建议；内部字段、CSV/JSON/Python 文件名、审计明细不得进入客户 DOCX。原 Answer 无引用来源时引用率显示“不适用”，不得写 0%。最终完成 strict validation 与中文客户报告视觉 QA 后交付。"
policy:
  allow_implicit_invocation: true
